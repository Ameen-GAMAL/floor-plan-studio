name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run acceptance tests
        run: python -m pytest -q --junitxml=work/test-results.xml

      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js

      - name: Check runtime without external services
        run: python scripts/offline_smoke.py

      - name: Build and verify source archive
        run: |
          python -m pip install cyclonedx-bom==7.2.1
          cyclonedx-py requirements requirements.lock.txt --of JSON -o work/sbom.cdx.json
          python scripts/package_project.py --sbom work/sbom.cdx.json

      - name: Upload test evidence and source archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: office-prototype-${{ matrix.os }}
          path: |
            work/test-results.xml
            outputs/offline-check.json
            outputs/floor-plan-studio.zip
            work/sbom.cdx.json
          retention-days: 14
          if-no-files-found: warn

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install ruff==0.14.0 mypy==1.18.2 bandit==1.9.1 pip-audit==2.10.0
      - run: python -m ruff check app scripts tests
      - run: python -m mypy
      - run: python -m bandit -q -r app
      - run: python -m pip_audit --require-hashes -r requirements.lock.txt
