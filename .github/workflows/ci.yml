name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run acceptance tests
        run: python -m pytest -q --junitxml=work/test-results.xml

      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js

      - name: Check runtime without external services
        run: python scripts/offline_smoke.py

      - name: Build and verify source archive
        run: python scripts/package_project.py

      - name: Upload test evidence and source archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: office-prototype-${{ matrix.os }}
          path: |
            work/test-results.xml
            outputs/offline-check.json
            outputs/floor-plan-studio.zip
          retention-days: 14
          if-no-files-found: warn
